<form (ngSubmit)="salvar()">
    <div>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" [(ngModel)]="cliente.nome" name="nome" required>
    </div>

    <div>
        <label for="email">Email:</label>
        <input type="email" id="email" [(ngModel)]="cliente.email" name="email" required>
    </div>

    <div>
        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" [(ngModel)]="cliente.telefone" name="telefone" required>
    </div>

    <div>
        <label for="endereco">Endereço:</label>
        <input type="text" id="endereco" [(ngModel)]="cliente.endereco" name="endereco" required>
    </div>

    <!-- <div>
        <label for="dataCadastro">Data de Cadastro:</label>
        <input type="date" id="dataCadastro" [(ngModel)]="cliente.dataCadastro" name="dataCadastro" required>
    </div> -->

    <button type="submit">Salvar</button>
</form>
